version: "2"
type: backend
tech_stack:
  - PHP 8+
  - CodeIgniter 4
  - MySQL
  - Bootstrap 5
  - jQuery
  - DataTables
  - SweetAlert2
  - TCPDF
features:
  - name: Shipment Booking Management
    description: Operations for creating, managing, listing, and deleting airway bill (AWB) bookings.
    files:
      - app/Controllers/Logistics.php
      - app/Models/BookingModel.php
      - app/Models/ShipmentItemModel.php
      - app/Models/SalesChargeModel.php
    endpoints:
      - method: GET
        path: /logistics
        description: Render dashboard with recent bookings
        auth_required: true
      - method: GET
        path: /logistics/manage
        description: Render all bookings list view
        auth_required: true
      - method: POST
        path: /logistics/ajax-datatable
        description: Fetch server-side paginated and searched bookings list
        auth_required: true
        response_schema:
          "200": object
      - method: POST
        path: /logistics/delete/{id}
        description: Atomically delete a booking and cascade delete child items
        auth_required: true
        response_schema:
          "200": object
  - name: Courier Manual Tracking & POD
    description: Core transit logs and Proof of Delivery (POD) signature and image upload workflows.
    files:
      - app/Controllers/TrackingController.php
      - app/Models/TrackingHistoryModel.php
    endpoints:
      - method: GET
        path: /tracking/history/{booking_id}
        description: Fetch chronological cargo tracking updates for a docket
        auth_required: true
        response_schema:
          "200": object
      - method: POST
        path: /tracking/save
        description: Create or update a courier transit log with optional POD file attachment
        auth_required: true
        response_schema:
          "200": object
      - method: POST
        path: /tracking/delete/{id}
        description: Hard delete a manual tracking record permanently from database
        auth_required: true
        response_schema:
          "200": object
  - name: Master Data Management
    description: Centralized listings for corporate masters including customers, airlines, transporters, and drivers.
    files:
      - app/Controllers/MasterController.php
      - app/Models/CustomerModel.php
      - app/Models/TransporterModel.php
      - app/Models/DriverModel.php
      - app/Models/AirlineModel.php
    endpoints:
      - method: POST
        path: /masters/ajax-datatable/{type}
        description: Serve server-side paginated data listings for masters
        auth_required: true
        response_schema:
          "200": object
known_limitations: []
